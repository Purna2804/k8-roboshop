apiVersion: v1 
kind: ConfigMap 
metadata:
  name: shipping 
  namespace: roboshop 
data:
  CART_ENDPOINT: cart:8080 
  DB_HOST: mysql 

---

apiVersion: apps/v1 
kind: Deployment
metadata:
  name: shipping 
  namespace: roboshop 
  labels:
    project: roboshop 
    tier: backend 
    component: shipping 
spec:
  replicas: 1 
  selector:
    matchLabels:
      project: roboshop 
      tier: backend 
      component: shipping 
  template:
    metadata:
      labels:
        project: roboshop 
        tier: backend 
        component: shipping 
    spec:
      containers:
      - name: shipping 
        image: chandu2828/shipping:v1
        ports:
        - containerPort: 8080
          name: liveness-port 
        startupProbe:
          httpGet:
            port: liveness-port 
            path: /health 
          failureThreshold: 12 
          periodSeconds: 10 
        readinessProbe:
          httpGet:
            Path: /health 
            port: liveness-port 
          periodSeconds: 10 
        livenessProbe:
          httpGet:
            path: /health 
            port: liveness-port 
          periodSeconds: 10 
        envFrom:
        - configMapRef:
            name: shipping 

---

apiVersion: v1 
kind: Service 
metadata:
  name: shipping 
  namespace: roboshop 
  labels:
    project: roboshop 
    tier: backend 
    component: shipping 
spec:
  selector:
    project: roboshop
    tier: backend 
    component: shipping 
  ports:
  - protocol: TCP 
    port: 8080 
    targetPort: 8080 